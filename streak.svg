<svg width="620" height="150" viewBox="0 0 620 150"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Streaks">
  <defs>
    <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1c26"/>
      <stop offset="100%" stop-color="#0e0f15"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="620" height="150" rx="18" fill="url(#cardbg)"/>
<text x="30" y="38" font-family="monospace" font-size="13" font-weight="700" fill="#9AA0B4" text-anchor="start">STREAKS</text>
<rect x="30.0" y="55" width="270.0" height="70" rx="14" fill="#FF6B6B" fill-opacity="0.15" stroke="#FF6B6B" stroke-width="1.5"/>
<text x="165.0" y="92" font-family="monospace" font-size="24" font-weight="800" fill="#FF6B6B" text-anchor="middle">8 🔥</text>
<text x="165.0" y="112" font-family="monospace" font-size="11" font-weight="600" fill="#9AA0B4" text-anchor="middle">current streak</text>
<rect x="320.0" y="55" width="270.0" height="70" rx="14" fill="#4D96FF" fill-opacity="0.15" stroke="#4D96FF" stroke-width="1.5"/>
<text x="455.0" y="92" font-family="monospace" font-size="24" font-weight="800" fill="#4D96FF" text-anchor="middle">8 🔥</text>
<text x="455.0" y="112" font-family="monospace" font-size="11" font-weight="600" fill="#9AA0B4" text-anchor="middle">longest streak</text>
</svg>
